    <!-- كود تفاعلي يضمن العمل على السيرفر وعلى المتصفح مباشرة -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const downloadUrl = "https://ai2a.appinventor.mit.edu/b/vu2f";
            const btn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            if (btn) {
                // التأكد من توجيه الرابط بشكل صحيح
                btn.href = downloadUrl;

                btn.addEventListener('click', function() {
                    btnIcon.className = "fa-solid fa-spinner fa-spin";
                    btnText.textContent = "جاري بدء التنزيل...";

                    setTimeout(() => {
                        btnIcon.className = "fa-solid fa-cloud-arrow-down";
                        btnText.textContent = "تحميل التطبيق الآن (APK)";
                    }, 4000);
                });
            }
        });
    </script>
