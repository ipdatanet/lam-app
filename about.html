    <!-- كود الجلب الذكي التلقائي (JavaScript Core) -->
    <script>
        const GITHUB_USER = "<?= $github_username; ?>";
        const GITHUB_REPO = "<?= $github_repo; ?>";

        async function findApkFromGithub() {
            const btn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const appName = document.getElementById('appNameDisplay');
            const version = document.getElementById('versionDisplay');
            const size = document.getElementById('sizeDisplay');
            const date = document.getElementById('dateDisplay');
            const statusBox = document.getElementById('statusBox');

            if (!GITHUB_USER || GITHUB_USER.includes("اسم_المستخدم")) {
                showError("تنبيه: يجب كتابة اسم المستخدم والمستودع داخل كود index.php أولاً.");
                return;
            }

            try {
                // 1. محاولة البحث داخل Releases أولاً
                const relRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/releases/latest`);
                
                if (relRes.ok) {
                    const relData = await relRes.json();
                    if (relData.assets && relData.assets.length > 0) {
                        const apkAsset = relData.assets.find(a => a.name.toLowerCase().endsWith('.apk'));
                        if (apkAsset) {
                            applySuccess({
                                name: relData.name || formatName(apkAsset.name),
                                version: relData.tag_name,
                                size: (apkAsset.size / (1024 * 1024)).toFixed(2) + ' MB',
                                date: new Date(apkAsset.updated_at).toLocaleDateString('ar-EG'),
                                url: apkAsset.browser_download_url
                            });
                            return;
                        }
                    }
                }

                // 2. إذا لم يجد في Releases، يبحث داخل شجرة ملفات المستودع (Branches)
                const treeRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`)
                    .then(r => r.ok ? r : fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/master?recursive=1`));

                if (treeRes.ok) {
                    const treeData = await treeRes.json();
                    if (treeData.tree) {
                        const apkFile = treeData.tree.find(f => f.path.toLowerCase().endsWith('.apk'));
                        if (apkFile) {
                            const branch = treeData.sha ? 'main' : 'master';
                            const rawUrl = `https://github.com/${GITHUB_USER}/${GITHUB_REPO}/raw/${branch}/${apkFile.path}`;
                            
                            applySuccess({
                                name: formatName(apkFile.path),
                                version: 'أحدث نسخة',
                                size: apkFile.size ? (apkFile.size / (1024 * 1024)).toFixed(2) + ' MB' : 'جاهز',
                                date: 'مباشر من المستودع',
                                url: rawUrl
                            });
                            return;
                        }
                    }
                }

                // إذا وصل هنا، يعني لم يجد أي ملف APK
                showError(`لم يتم العثور على أي ملف بصيغة (.apk) داخل المستودع "${GITHUB_REPO}". تأكد من رفعه في Releases أو داخل الملفات.`);

            } catch (err) {
                showError("تعذر الاتصال بـ GitHub. يرجى التأكد من أن المستودع عام (Public) وليس خاصاً.");
            }

            function applySuccess(data) {
                appName.textContent = data.name;
                version.textContent = data.version;
                size.textContent = data.size;
                date.textContent = data.date;
                btn.href = data.url;

                btn.classList.remove('btn-loading');
                btnIcon.className = "fa-solid fa-cloud-arrow-down";
                btnText.textContent = "تحميل التطبيق الآن (APK)";
            }

            function showError(msg) {
                btn.classList.add('btn-loading');
                btn.removeAttribute('href');
                btnIcon.className = "fa-solid fa-triangle-exclamation";
                btnText.textContent = "غير متاح للتحميل";
                version.textContent = "غير متوفر";
                
                statusBox.style.display = "block";
                statusBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${msg}`;
            }

            function formatName(filename) {
                let name = filename.split('/').pop().replace(/\.apk$/i, '');
                return name.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            }
        }

        // تشغيل الفحص فور فتح الصفحة
        document.addEventListener('DOMContentLoaded', findApkFromGithub);
    </script>
