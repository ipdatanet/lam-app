<?php
/**
 * ==================================================================
 *  إعدادات المستودع (يكفي فقط وضع اسم حسابك واسم المستودع)
 * ==================================================================
 */
$github_user = "اسم_المستخدم";   // مثال: username
$github_repo = "اسم_المستودع";    // مثال: my-android-app

// دالة مساعدة لطلب بيانات GitHub API
function fetchGithub($url) {
    $ch = curl_init();
    curl_setopt($ch, CURLOPT_URL, $url);
    curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
    curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);
    curl_setopt($ch, CURLOPT_HTTPHEADER, [
        'User-Agent: APK-Auto-Discovery-App',
        'Accept: application/vnd.github.v3+json'
    ]);
    $res = curl_exec($ch);
    curl_close($ch);
    return json_decode($res, true);
}

// المتغيرات الافتراضية
$app_name       = "تطبيق أندرويد";
$version_tag    = "أحدث إصدار";
$apk_url        = "";
$apk_size       = "غير معروف";
$release_notes  = "";
$updated_date   = "مؤخراً";
$download_count = 0;
$found_apk      = false;

// 1. محاولة جلب آخر إصدار (Release)
$release = fetchGithub("https://api.github.com/repos/{$github_user}/{$github_repo}/releases/latest");

if ($release && !isset($release['message'])) {
    if (!empty($release['assets'])) {
        foreach ($release['assets'] as $asset) {
            if (pathinfo($asset['name'], PATHINFO_EXTENSION) === 'apk') {
                $apk_url        = $asset['browser_download_url'];
                $apk_size       = round($asset['size'] / (1024 * 1024), 2) . ' MB';
                $version_tag    = $release['tag_name'];
                $download_count = $asset['download_count'];
                $updated_date   = date("Y/m/d - H:i", strtotime($asset['updated_at']));
                $release_notes  = trim($release['body'] ?? '');
                
                // استخراج اسم التطبيق من عنوان الإصدار أو اسم الملف
                $clean_filename = pathinfo($asset['name'], PATHINFO_FILENAME);
                $app_name       = !empty($release['name']) ? $release['name'] : ucwords(str_replace(['-', '_', 'app'], ' ', $clean_filename));
                
                $found_apk      = true;
                break;
            }
        }
    }
}

// 2. إذا لم يجد في Releases، يبحث داخل شجرة ملفات المستودع مباشرة (Fallback)
if (!$found_apk) {
    $tree = fetchGithub("https://api.github.com/repos/{$github_user}/{$github_repo}/git/trees/main?recursive=1");
    if (isset($tree['message'])) { // تجربة فرع master إذا فشل main
        $tree = fetchGithub("https://api.github.com/repos/{$github_user}/{$github_repo}/git/trees/master?recursive=1");
    }

    if (!empty($tree['tree'])) {
        foreach ($tree['tree'] as $file) {
            if (pathinfo($file['path'], PATHINFO_EXTENSION) === 'apk') {
                $branch = isset($tree['sha']) ? 'main' : 'master';
                $apk_url   = "https://raw.githubusercontent.com/{$github_user}/{$github_repo}/{$branch}/" . $file['path'];
                $apk_size  = round($file['size'] / (1024 * 1024), 2) . ' MB';
                
                $raw_name  = pathinfo($file['path'], PATHINFO_FILENAME);
                $app_name  = ucwords(str_replace(['-', '_', 'app'], ' ', $raw_name));
                
                // محاولة استخراج رقم الإصدار من اسم الملف (مثال: app-v1.2.3.apk)
                if (preg_match('/v?([0-9]+(\.[0-9]+)+)/i', $raw_name, $matches)) {
                    $version_tag = 'v' . $matches[1];
                }
                
                $updated_date = "متزامن مع المستودع";
                $found_apk    = true;
                break;
            }
        }
    }
}
