<?php
/**
 * =====================================================================
 *  ضع رابط ملف الـ APK الخاص بمستودعك هنا فقط (أي نوع رابط من GitHub)
 * =====================================================================
 * أمثلة على الروابط المدعومة:
 * 1) رابط من Releases: "https://github.com/user/repo/releases/download/v1.2.0/My_App.apk"
 * 2) رابط ملف عادي:    "https://github.com/user/repo/blob/main/app-release.apk"
 * 3) رابط Raw مباشر:    "https://raw.githubusercontent.com/user/repo/main/app.apk"
 */
$apk_link = "https://ai2a.appinventor.mit.edu/b/vu2f";

// =================== معالجة الرابط تلقائياً ===================
$app_name     = "تطبيق غير معروف";
$version_tag  = "v1.0.0";
$file_size    = "جاهز للتحميل";
$direct_url   = "#";
$original_file = "";
$is_valid     = false;

$apk_link = trim($apk_link);

if (!empty($apk_link) && $apk_link !== "ضع_رابط_الملف_هنا") {
    $is_valid = true;

    // 1. تحويل روابط blob العادية إلى روابط Raw قابلة للتحميل المباشر
    if (strpos($apk_link, 'github.com') !== false && strpos($apk_link, '/blob/') !== false) {
        $direct_url = str_replace(['github.com', '/blob/'], ['raw.githubusercontent.com', '/'], $apk_link);
    } else {
        $direct_url = $apk_link;
    }

    // 2. استخراج اسم الملف الأصلي
    $parsed_path   = parse_url($direct_url, PHP_URL_PATH);
    $original_file = basename($parsed_path); // مثال: "My_Application-v2.1.apk"
    $clean_name    = pathinfo($original_file, PATHINFO_FILENAME);

    // 3. استخراج رقم الإصدار تلقائياً (من مسار Releases أو اسم الملف)
    if (preg_match('/\/download\/([^\/]+)\//i', $apk_link, $v_match)) {
        $version_tag = $v_match[1];
    } elseif (preg_match('/v?([0-9]+(\.[0-9]+)+)/i', $original_file, $v_match)) {
        $version_tag = 'v' . $v_match[1];
    }

    // 4. تنظيف وتوليد اسم التطبيق تلقائياً
    $clean_name = preg_replace('/[-_]?v?[0-9]+(\.[0-9]+)+/i', '', $clean_name); // إزالة رقم الإصدار من الاسم
    $clean_name = trim(str_replace(['-', '_', '.'], ' ', $clean_name));
    if (!empty($clean_name)) {
        $app_name = ucwords($clean_name);
    } else {
        $app_name = pathinfo($original_file, PATHINFO_FILENAME);
    }

    // 5. فحص حجم الملف الفعلي تلقائياً (عبر cURL HEAD Request)
    $ch = curl_init($direct_url);
    curl_setopt($ch, CURLOPT_NOBODY, true);
    curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
    curl_setopt($ch, CURLOPT_FOLLOWLOCATION, true);
    curl_setopt($ch, CURLOPT_SSL_VERIFYPEER, false);
    curl_setopt($ch, CURLOPT_TIMEOUT, 6);
    curl_setopt($ch, CURLOPT_USERAGENT, 'Mozilla/5.0');
    curl_exec($ch);
    $content_length = curl_getinfo($ch, CURLINFO_CONTENT_LENGTH_DOWNLOAD);
    curl_close($ch);

    if ($content_length > 0) {
        $file_size = round($content_length / (1024 * 1024), 2) . " MB";
    }
}
