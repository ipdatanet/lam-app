<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>القرآن المبين</title>

<!-- إعدادات وتوافق PWA و PWABuilder -->
<meta name="theme-color" content="#0e3b36">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="القرآن المبين">
<meta name="application-name" content="القرآن المبين">
<meta name="description" content="تطبيق القرآن المبين لقراءة واستماع القرآن الكريم برواية حفص عن عاصم بدون إنترنت">

<!-- ربط ملف الـ Manifest المدمج -->
<link rel="manifest" href='data:application/manifest+json,{"id":"/index.html","name":"القرآن المبين","short_name":"","description":"تطبيق القرآن المبين لقراءة واستماع القرآن الكريم برواية حفص عن عاصم بدون إنترنت","start_url":"./index.html","scope":"./","display":"standalone","orientation":"portrait","background_color":"#00a3ff","theme_color":"#00a3ff","dir":"rtl","lang":"ar","categories":["books","education","lifestyle"],"icons":[{"src":"./icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"./icon-192.png","sizes":"192x192","type":"image/png","purpose":"maskable"},{"src":"./icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},{"src":"./icon-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}]}'>

<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e3b36;
    --ink-2:#123f3a;
    --gold:#c9a24b;
    --gold-soft:#e7cf8f;
    --parchment:#fdfbf7;
    --parchment-2:#f4eee1;
    --card:#ffffff;
    --text-main:#111a18;
    --text-muted:#5b6d68;
    --line:#e5dcc3;
    --shadow: 0 8px 24px rgba(14,59,54,.08);
    --radius:16px;
    --mushaf-size: clamp(20px, 5.85vw, 30px);
    --header-frame-bg: rgba(201, 162, 75, 0.08);
    --header-frame-border: #c9a24b;
    color-scheme: light;
  }
  html.night{
    --ink:#051210;
    --ink-2:#000000;
    --parchment:#000000;
    --parchment-2:#0d1413;
    --card:#0a1210;
    --text-main:#ffffff;
    --text-muted:#839791;
    --line:#1b2523;
    --shadow: 0 10px 30px rgba(0,0,0,.7);
    --header-frame-bg: rgba(201, 162, 75, 0.12);
    --header-frame-border: #8b7437;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;height:100%;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--parchment);
    color:var(--text-main);
    overflow-x:hidden;
    transition:background .2s ease,color .2s ease;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a,button{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;color:inherit;}

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(160deg,var(--ink),var(--ink-2));
    position:sticky;top:0;z-index:30;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  .header-inner{
    position:relative;
    max-width:900px;margin:0 auto;
    padding:12px 16px;
    display:flex;align-items:center;justify-content:center;
    min-height:50px;
  }
  .header-inner h1{
    margin:0;font-size:18px;font-weight:800;color:var(--gold-soft);
    letter-spacing:.5px;text-align:center;
  }
  .icon-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-soft);font-size:19px;
    background:rgba(255,255,255,.06);
    transition:background .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,.14);}
  #settingsBtn{right:10px;}
  #backBtn{left:10px;font-size:20px;}
  #bookmarkBtn{right:10px;font-size:18px;}
  #bookmarkBtn.marked{color:var(--gold);}

  /* ---------- Home ---------- */
  #homeView{max-width:900px;margin:0 auto;width:100%;padding:16px 14px 60px;flex:1;}
  .tabs{
    display:flex;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:5px;margin:6px 0 14px;box-shadow:var(--shadow);
  }
  .tab-btn{
    flex:1;padding:10px 8px;border-radius:999px;font-weight:700;font-size:14.5px;
    color:var(--text-muted);transition:all .2s ease;
  }
  .tab-btn.active{background:var(--ink);color:var(--gold-soft);}

  .resume-card{margin-bottom:14px;}
  .resume-inner{
    width:100%;display:flex;align-items:center;gap:12px;
    background:var(--ink);color:var(--gold-soft);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);text-align:right;
  }
  .resume-icon{font-size:20px;flex:none;}
  .resume-text{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .resume-title{font-weight:800;font-size:14px;}
  .resume-sub{font-size:12px;color:#cfe3df;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .grid{display:flex;flex-direction:column;gap:10px;}
  .hidden{display:none !important;}

  .sections-scroller{
    display:flex;flex-direction:row;overflow-x:auto;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
    height:calc(100vh - 165px);
  }
  .section-panel{
    flex:0 0 100%;width:100%;box-sizing:border-box;scroll-snap-align:start;
    height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;
  }

  .surah-card, .juz-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow);transition:transform .15s ease, border-color .15s ease;
    text-align:right;
  }
  .surah-card:active, .juz-card:active{transform:scale(.97);}
  .surah-card:hover, .juz-card:hover{border-color:var(--gold);}
  .badge{
    flex:none;width:38px;height:38px;border-radius:10px;
    background:var(--ink);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;position:relative;
  }
  .badge::before{
    content:"";position:absolute;inset:3px;border:1px solid rgba(201,162,75,.5);border-radius:7px;
  }
  .s-info{flex:1;min-width:0;}
  .s-name{display:block;font-family:'Tajawal',sans-serif;font-weight:800;font-size:16px;color:var(--text-main);}
  .s-meta{display:block;font-size:12px;color:var(--text-muted);margin-top:4px;}
  .s-range{display:block;font-size:12px;color:var(--gold);margin-top:4px;font-weight:700;}
  .empty-msg, .load-msg{text-align:center;padding:40px 14px;color:var(--text-muted);font-size:14px;}
  .load-msg .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);
    margin:0 auto 10px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Reader: True Mushaf Layout ---------- */
  #readerView{
    width:100%;margin:0 auto;padding:0 0 20px;flex:1;
    display:flex;flex-direction:column;background:var(--card);
  }
  .audio-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:25;
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -6px 22px rgba(0,0,0,.14);
    display:flex;align-items:center;justify-content:center;gap:16px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .ab-btn{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--text-main);background:var(--parchment-2);
    border:1px solid var(--line);
  }
  .ab-btn:hover{border-color:var(--gold);}
  .ab-btn.ab-main{
    width:54px;height:54px;font-size:20px;
    background:var(--ink);color:var(--gold-soft);border-color:var(--ink);
  }
  .ab-btn.active{background:var(--gold);color:#2b2308;border-color:var(--gold);}

  .mushaf{
    background:var(--card);width:100%;
    display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  }
  .mushaf > .load-msg, .mushaf > .empty-msg{flex:0 0 100%;width:100%;}
  
  .qcf-page{
    flex:0 0 100%;width:100%;max-width:580px;margin:0 auto;box-sizing:border-box;
    scroll-snap-align:start;padding:4px 8px 12px;display:flex;flex-direction:column;
    justify-content:space-between;height:calc(100vh - 56px);user-select:none;
  }
  .qcf-page-num{
    text-align:center;font-size:11.5px;color:var(--text-muted);margin:0 0 2px;flex:none;
    font-family:'Tajawal',sans-serif;
  }
  .qcf-page-num::before, .qcf-page-num::after{content:"—";color:var(--gold);margin:0 8px;opacity:.6;}
  
  .qcf-lines{display:flex;flex-direction:column;width:100%;}

  /* صفحات المصحف العادية (١٥ سطراً) */
  .qcf-page:not(.qcf-page-opening) .qcf-lines{justify-content:space-between;flex:1;}
  .qcf-page:not(.qcf-page-opening) .qcf-line{
    direction:rtl;display:flex;justify-content:space-between;align-items:center;
    width:100%;white-space:nowrap;font-size:var(--mushaf-size);line-height:1;
    height:calc((100vh - 80px) / 15);max-height:54px;
  }

  /* صفحتا البداية (الفاتحة وأول البقرة مع تباعد متناسق) */
  .qcf-page-opening .qcf-lines{
    justify-content:center;
    gap:13px;
    margin:auto 0;flex:1;
  }
  .qcf-page-opening .qcf-line{
    direction:rtl;display:flex;justify-content:center !important;align-items:center;
    width:100%;white-space:nowrap;font-size:var(--mushaf-size);line-height:1.25;gap:7px;
  }

  .qcf-line.qcf-header-line{
    justify-content:center !important;background:var(--header-frame-bg);
    border:1.5px solid var(--header-frame-border);border-radius:8px;
    padding:3px 12px;margin:4px auto 6px;width:94%;max-width:440px;
    font-size:calc(var(--mushaf-size) * 0.95);
  }
  .qcf-line.qcf-line-center{justify-content:center !important;gap:8px;}

  .qcf-word{
    font-size:inherit;color:var(--text-main);cursor:pointer;border-radius:4px;
    transition:background .15s ease, color .15s ease;display:inline-block;padding:0;
  }
  .qcf-word:hover{background:var(--parchment-2);}
  .qcf-word.playing{background:var(--gold-soft);color:#2b2308 !important;}
  html.night .qcf-word.playing{background:#bda255;color:#000000 !important;font-weight:bold;}
  .qcf-line-center .qcf-word, .qcf-header-line .qcf-word{cursor:default;}

  /* ---------- Settings Drawer ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;backdrop-filter:blur(2px);}
  .drawer{
    position:fixed;top:0;bottom:0;right:0;width:min(94vw,400px);z-index:50;
    background:var(--parchment);box-shadow:-8px 0 30px rgba(0,0,0,.35);
    padding:18px 16px;overflow-y:auto;transform:translateX(0);transition:transform .26s ease;
  }
  .drawer.slide-out{transform:translateX(110%);}
  .drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .drawer-header h2{margin:0;font-size:18px;font-weight:800;color:var(--text-main);}
  .drawer-header .close-x{font-size:22px;color:var(--text-muted);}

  .settings-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .settings-card-title{font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  
  select{
    width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--parchment-2);
    color:var(--text-main);font-size:13.5px;outline:none;
  }
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .switch{position:relative;width:44px;height:24px;background:var(--line);border-radius:99px;transition:.2s;flex:none;}
  .switch::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;}
  .switch.on{background:var(--gold);}
  .switch.on::after{right:22px;}
  
  .dl-action-btn{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--ink);color:var(--gold-soft);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:space-between;transition:opacity .2s;
  }
  .dl-action-btn:disabled{opacity:0.65;cursor:not-allowed;}
  .dl-progress-bar{
    height:5px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden;display:none;
  }
  .dl-progress-bar.show{display:block;}
  .dl-progress-fill{height:100%;width:0%;background:var(--gold);transition:width .15s linear;}
  
  .drawer-btn{
    width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--text-main);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .drawer-btn.danger{color:#dc3545;border-color:rgba(220,53,69,0.25);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:90;
    backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    max-width:360px;width:100%;padding:20px 18px;box-shadow:0 15px 40px rgba(0,0,0,0.4);
    text-align:center;animation:modalPop .22s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes modalPop{from{transform:scale(0.88);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-title{font-weight:800;font-size:16px;color:var(--text-main);margin-bottom:8px;}
  .modal-body{font-size:13.5px;color:var(--text-muted);line-height:1.55;margin-bottom:18px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-btn{flex:1;padding:10px;border-radius:10px;font-size:13.5px;font-weight:700;}
  .modal-btn.confirm{background:var(--ink);color:var(--gold-soft);border:1px solid var(--ink);}
  .modal-btn.cancel{background:var(--parchment-2);color:var(--text-main);border:1px solid var(--line);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#f4ead0;padding:10px 18px;border-radius:99px;
    font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:88vw;text-align:center;
  }
  ::selection{background:var(--gold-soft);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-inner">
      <button id="backBtn" class="icon-btn hidden" title="رجوع">➜</button>
      <h1 id="appTitle">القرآن المبين</h1>
      <button id="settingsBtn" class="icon-btn" title="الإعدادات">⚙</button>
      <button id="bookmarkBtn" class="icon-btn hidden" title="حفظ العلامة المرجعية">🔖</button>
    </div>
  </header>

  <!-- HOME -->
  <main id="homeView">
    <div class="tabs">
      <button class="tab-btn active" data-tab="surah">السور</button>
      <button class="tab-btn" data-tab="juz">الأجزاء</button>
    </div>
    <div id="resumeCard" class="resume-card hidden"></div>
    <div id="sectionsScroller" class="sections-scroller">
      <div class="section-panel" data-panel="surah">
        <div id="surahGrid" class="grid">
          <div class="load-msg"><div class="spinner"></div>جاري تحميل قائمة السور…</div>
        </div>
      </div>
      <div class="section-panel" data-panel="juz">
        <div id="juzGrid" class="grid"></div>
      </div>
    </div>
  </main>

  <!-- READER -->
  <main id="readerView" class="hidden">
    <div id="mushafContainer" class="mushaf">
      <div class="load-msg"><div class="spinner"></div>جاري التحميل…</div>
    </div>
  </main>

  <div id="audioBar" class="audio-bar hidden">
    <button id="repeatBtn" class="ab-btn" title="تكرار الآية">🔁</button>
    <button id="nextBtn" class="ab-btn" title="الآية التالية">⏭</button>
    <button id="playPauseBtn" class="ab-btn ab-main">▶</button>
    <button id="prevBtn" class="ab-btn" title="الآية السابقة">⏮</button>
  </div>

  <div id="settingsOverlay" class="overlay hidden"></div>
  <aside id="settingsDrawer" class="drawer hidden slide-out">
    <div class="drawer-header">
      <h2>الإعدادات</h2>
      <button class="close-x" id="closeDrawerBtn">✕</button>
    </div>

    <div class="settings-card">
      <div class="settings-card-title">🎙 القارئ المعتمد</div>
      <select id="reciterSelect"></select>
    </div>

    <div class="settings-card row-between">
      <span class="settings-card-title" style="margin:0;">🌙 الوضع المظلم</span>
      <button id="nightModeToggle" class="switch"></button>
    </div>

    <div class="settings-card">
      <div class="settings-card-title">📖 المصحف للقراءة بدون نت</div>
      <button id="downloadAllPagesBtn" class="dl-action-btn">
        <span>تنزيل صفحات المصحف (٦٠٤)</span>
        <span id="pagesPercent">⬇</span>
      </button>
      <div class="dl-progress-bar" id="pagesBarWrap">
        <div class="dl-progress-fill" id="pagesBarFill"></div>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-card-title">🎧 تلاوة القارئ للاستماع بدون نت</div>
      <button id="downloadAllAudioBtn" class="dl-action-btn">
        <span>تنزيل صوت القارئ الحالي</span>
        <span id="audioPercent">⬇</span>
      </button>
      <div class="dl-progress-bar" id="audioBarWrap">
        <div class="dl-progress-fill" id="audioBarFill"></div>
      </div>
    </div>

    <div class="settings-card" style="border-color:transparent;background:transparent;padding:0;box-shadow:none;">
      <button id="clearCacheBtn" class="drawer-btn danger">🗑 مسح كل البيانات المحفوظة</button>
    </div>
  </aside>

  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">تأكيد</div>
      <div class="modal-body" id="modalMessage"></div>
      <div class="modal-actions">
        <button id="modalConfirmBtn" class="modal-btn confirm">حسناً</button>
        <button id="modalCancelBtn" class="modal-btn cancel">إلغاء</button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="none"></audio>
  <div id="toast" class="toast hidden"></div>
</div>

<script>
(function(){
"use strict";

/* ================= STORAGE & OFFLINE DB ================= */
const memoryStore = {};
const storage = {
  get(k){ try{ return window.localStorage.getItem(k); }catch(e){ return memoryStore[k] || null; } },
  set(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ memoryStore[k]=v; return false; } },
  remove(k){ try{ window.localStorage.removeItem(k); }catch(e){ delete memoryStore[k]; } },
  keys(){ try{ return Object.keys(window.localStorage); }catch(e){ return Object.keys(memoryStore); } }
};

const IDB_NAME = "qm_offline_db";
const IDB_VERSION = 2;
let idbPromise = null;

function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB not available")); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      ["pages","audio","meta","fonts"].forEach(store => {
        if(!db.objectStoreNames.contains(store)) db.createObjectStore(store);
      });
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return idbPromise;
}

async function idbGet(store, key){
  try{
    const db = await openIDB();
    return await new Promise((res, rej)=>{
      const tx = db.transaction(store, "readonly");
      const req = tx.objectStore(store).get(key);
      req.onsuccess = ()=>res(req.result);
      req.onerror = ()=>rej(req.error);
    });
  }catch(e){ return undefined; }
}

async function idbSet(store, key, val){
  try{
    const db = await openIDB();
    return await new Promise((res, rej)=>{
      const tx = db.transaction(store, "readwrite");
      tx.objectStore(store).put(val, key);
      tx.oncomplete = ()=>res(true);
      tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){ return false; }
}

async function idbClear(store){
  try{
    const db = await openIDB();
    return await new Promise((res, rej)=>{
      const tx = db.transaction(store, "readwrite");
      tx.objectStore(store).clear();
      tx.oncomplete = ()=>res(true);
      tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){ return false; }
}

/* محرك التنزيل السريع المتزامن */
async function runConcurrent(tasks, concurrency, onProgress){
  let index = 0;
  let completed = 0;
  const total = tasks.length;
  async function worker(){
    while(index < tasks.length){
      const taskIndex = index++;
      try{ await tasks[taskIndex](); }catch(e){}
      completed++;
      if(onProgress) onProgress(completed, total);
    }
  }
  const workers = Array.from({length: Math.min(concurrency, tasks.length)}, () => worker());
  await Promise.all(workers);
}

  });
}

/* ================= READER: FETCH & RENDER ================= */
async function openReader(mode, number, scrollToPage){
  showReader();
  state.currentMode = mode;
  state.currentNumber = number;
  stopAudio();
  $("#mushafContainer").innerHTML = `<div class="load-msg"><div class="spinner"></div>جاري التحميل…</div>`;

  try{
    await loadQcfIndex();
    let title, pageStart, pageEnd;
    if(mode === "surah"){
      const ch = state.qcfIndex.chapters.find(c=>c.id===number);
      title = ch.name_arabic;
      pageStart = ch.pages[0]; pageEnd = ch.pages[1];
    } else {
      await loadQcfVerses();
      const [startKey, endKey] = JUZ_BOUNDS[number];
      title = `الجزء ${toArabicDigits(number)}`;
      pageStart = state.qcfVerses[startKey].page;
      pageEnd = state.qcfVerses[endKey].page;
    }

    const nums = [];
    for(let p=pageStart;p<=pageEnd;p++) nums.push(p);

    const pages = await Promise.all(nums.map(async p=>{
      const cached = await idbGet("pages", p);
      if(cached && isCompletePage(cached)) return cached;
      const data = await fetchQcfJson(`pages/${pad3(p)}.json`);
      if(isCompletePage(data)) idbSet("pages", p, data);
      return data;
    }));

    state.currentTitle = title;
    state.currentPages = pages;
    renderQcfPages(pages);
    state.currentVisiblePage = scrollToPage || pageStart;
    updateBookmarkBtn();
    if(scrollToPage){
      const target = document.querySelector(`.qcf-page[data-page="${scrollToPage}"]`);
      if(target) target.scrollIntoView({behavior:"auto", inline:"start", block:"nearest"});
    }
  }catch(err){
    $("#mushafContainer").innerHTML = `
      <div class="empty-msg">
        تعذّر تحميل صفحات المصحف. تحقق من اتصالك أو قم بتحميل المصحف للعمل بدون إنترنت.
        <br><button id="retryOpenBtn" class="drawer-btn" style="margin-top:14px;max-width:220px;margin-inline:auto;">إعادة المحاولة</button>
      </div>`;
    const retryBtn = document.getElementById("retryOpenBtn");
    if(retryBtn) retryBtn.addEventListener("click", ()=>openReader(mode, number, scrollToPage));
  }
}

function renderQcfPages(pages){
  const box = $("#mushafContainer");
  const ayahs = [];
  const ayahIndexByKey = {};

  let html = "";
  pages.forEach(page=>{
    const isSpecialPage = page.page === 1 || page.page === 2;
    html += `<div class="qcf-page${isSpecialPage ? " qcf-page-opening" : ""}" data-page="${page.page}">`;
    html += `<div class="qcf-page-num">صفحة ${toArabicDigits(page.page)}</div>`;
    html += `<div class="qcf-lines">`;
    page.lines.forEach((line, lineIdx)=>{
      const firstWord = line.words[0];
      const isHeader = firstWord && firstWord.type === "surah_header";
      const isBsm = firstWord && firstWord.type === "bismillah";
      const isShortEndLine = line.words.length <= 2 && (
        lineIdx === page.lines.length - 1 || 
        (page.lines[lineIdx + 1] && page.lines[lineIdx + 1].words[0] && page.lines[lineIdx + 1].words[0].type === "surah_header")
      );

      let lineClass = "qcf-line";
      if(isHeader) lineClass += " qcf-header-line";
      else if(isSpecialPage || isBsm || isShortEndLine) lineClass += " qcf-line-center";

      html += `<div class="${lineClass}">`;
      line.words.forEach(word=>{
        const verseAttr = word.verse_key ? ` data-verse="${word.verse_key}"` : "";
        html += `<span class="qcf-word" style="font-family:'${word.font}'"${verseAttr}>${word.char}</span>`;
        if(word.verse_key && (word.type === "word" || word.type === "end")){
          if(!(word.verse_key in ayahIndexByKey)){
            const [sNo, aNo] = word.verse_key.split(":").map(Number);
            ayahIndexByKey[word.verse_key] = ayahs.length;
            ayahs.push({surahNo:sNo, ayahNo:aNo, key:word.verse_key, text:""});
          }
          if(word.type === "word") ayahs[ayahIndexByKey[word.verse_key]].text += word.text + " ";
        }
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });

  box.innerHTML = html;
  state.currentAyahs = ayahs;
  observeVisiblePages(box);
}

let pageObserver = null;
function observeVisiblePages(box){
  if(pageObserver) pageObserver.disconnect();
  pageObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6){
        state.currentVisiblePage = parseInt(entry.target.dataset.page, 10);
        updateBookmarkBtn();
      }
    });
  }, {root: box, threshold: 0.6});
  box.querySelectorAll(".qcf-page").forEach(p=>pageObserver.observe(p));
}

/* ================= AUDIO PLAYBACK ================= */
const audioEl = $("#audioPlayer");

async function playFromIndex(idx){
  if(idx<0 || idx>=state.currentAyahs.length) return;
  state.playIndex = idx;
  const a = state.currentAyahs[idx];
  const key = `${state.reciter}:${a.surahNo}:${a.ayahNo}`;

  if(state.currentBlobUrl){ URL.revokeObjectURL(state.currentBlobUrl); state.currentBlobUrl = null; }

  let src = ayahAudioUrl(state.reciter, a.surahNo, a.ayahNo);
  const blob = await idbGet("audio", key);
  if(blob){
    src = URL.createObjectURL(blob);
    state.currentBlobUrl = src;
  }

  audioEl.src = src;
  audioEl.play().catch(()=>{ toast("تعذّر تشغيل الصوت لهذه الآية"); });
  highlightPlaying(idx);
  state.isPlaying = true;
  $("#playPauseBtn").textContent = "❚❚";
}

function highlightPlaying(idx){
  $$(".qcf-word.playing").forEach(el=>el.classList.remove("playing"));
  const a = state.currentAyahs[idx];
  if(!a) return;
  const els = document.querySelectorAll(`.qcf-word[data-verse="${a.key}"]`);
  els.forEach(el=>el.classList.add("playing"));
  if(els[0]){
    const pageEl = els[0].closest(".qcf-page");
    if(pageEl){
      pageEl.scrollIntoView({behavior:"smooth", inline:"start", block:"nearest"});
      state.currentVisiblePage = parseInt(pageEl.dataset.page, 10);
      updateBookmarkBtn();
    }
  }
}

audioEl.addEventListener("ended", async ()=>{
  if(state.repeat){
    playFromIndex(state.playIndex);
    return;
  }
  if(state.playIndex + 1 < state.currentAyahs.length){
    playFromIndex(state.playIndex + 1);
    return;
  }
  if(state.currentMode === "surah" && state.currentNumber < 114){
    const nextNum = state.currentNumber + 1;
    toast("جاري الانتقال إلى السورة التالية…");
    await openReader("surah", nextNum);
    playFromIndex(0);
  } else {
    state.isPlaying = false;
    state.playIndex = -1;
    $("#playPauseBtn").textContent = "▶";
    $$(".qcf-word.playing").forEach(el=>el.classList.remove("playing"));
    toast("انتهت التلاوة");
  }
});

audioEl.addEventListener("error", ()=>{
  if(state.isPlaying && state.playIndex >= 0 && state.playIndex + 1 < state.currentAyahs.length){
    setTimeout(()=>playFromIndex(state.playIndex + 1), 1000);
  }
});

function stopAudio(){
  audioEl.pause();
  audioEl.removeAttribute("src");
  state.isPlaying = false;
  state.playIndex = -1;
  $("#playPauseBtn").textContent = "▶";
  $$(".qcf-word.playing").forEach(el=>el.classList.remove("playing"));
}

$("#playPauseBtn").addEventListener("click", ()=>{
  if(!state.currentAyahs.length) return;
  if(state.isPlaying){
    audioEl.pause();
    state.isPlaying = false;
    $("#playPauseBtn").textContent = "▶";
  } else if(state.playIndex >= 0 && audioEl.src){
    audioEl.play();
    state.isPlaying = true;
    $("#playPauseBtn").textContent = "❚❚";
    showAudioBar();
  } else {
    playFromIndex(0);
    showAudioBar();
  }
});

$("#nextBtn").addEventListener("click", ()=>{
  if(!state.currentAyahs.length) return;
  if(state.playIndex + 1 < state.currentAyahs.length){
    playFromIndex(state.playIndex + 1);
    showAudioBar();
  } else if(state.currentMode === "surah" && state.currentNumber < 114){
    openReader("surah", state.currentNumber + 1).then(()=>playFromIndex(0));
    showAudioBar();
  } else {
    toast("هذه آخر آية");
  }
});

$("#prevBtn").addEventListener("click", ()=>{
  if(!state.currentAyahs.length) return;
  if(state.playIndex > 0){
    playFromIndex(state.playIndex - 1);
    showAudioBar();
  } else if(state.currentMode === "surah" && state.currentNumber > 1){
    openReader("surah", state.currentNumber - 1).then(()=>{
      playFromIndex(state.currentAyahs.length - 1);
      showAudioBar();
    });
  } else if(state.playIndex === 0){
    playFromIndex(0);
    showAudioBar();
  } else {
    toast("افتح آية أولًا");
  }
});

$("#repeatBtn").addEventListener("click", ()=>{
  state.repeat = !state.repeat;
  $("#repeatBtn").classList.toggle("active", state.repeat);
  toast(state.repeat ? "تكرار الآية: مفعّل" : "تكرار الآية: متوقف");
  showAudioBar();
});

/* ================= ULTRA FAST PARALLEL DOWNLOADS ================= */
const TOTAL_PAGES = 604;
const TOTAL_AYAHS = 6236;

async function cacheAllFonts(){
  const fontTasks = [];
  for(let i=1; i<=QCF_HAFS_FONT_COUNT; i++){
    const fFile = `QCF4_Hafs_${pad2(i)}_W.woff2`;
    fontTasks.push(async ()=>{
      const cached = await idbGet("fonts", fFile);
      if(!cached){
        const res = await fetch(`${QCF_FONT_CDN}/${fFile}`);
        if(res.ok){
          const blob = await res.blob();
          await idbSet("fonts", fFile, blob);
        }
      }
    });
  }
  fontTasks.push(async ()=>{
    const bsmFile = "QCF4_QBSML.woff2";
    const bsmCached = await idbGet("fonts", bsmFile);
    if(!bsmCached){
      const res = await fetch(`${QCF_FONT_CDN}/${bsmFile}`);
      if(res.ok){
        const blob = await res.blob();
        await idbSet("fonts", bsmFile, blob);
      }
    }
  });
  await runConcurrent(fontTasks, 8);
}

async function downloadAllPages(onProgress){
  await loadQcfIndex();
  await loadQcfVerses();
  await cacheAllFonts();

  const pageTasks = [];
  for(let p=1; p<=TOTAL_PAGES; p++){
    pageTasks.push(async ()=>{
      const cached = await idbGet("pages", p);
      if(!cached || !isCompletePage(cached)){
        const data = await fetchQcfJson(`pages/${pad3(p)}.json`);
        if(isCompletePage(data)) await idbSet("pages", p, data);
      }
    });
  }
  await runConcurrent(pageTasks, 10, onProgress);
  await registerQcfFonts();
}

async function downloadAllAudio(reciterId, onProgress){
  await loadQcfIndex();
  const chapters = state.qcfIndex.chapters;
  const audioTasks = [];

  for(const ch of chapters){
    for(let ayah=1; ayah<=ch.verses_count; ayah++){
      const key = `${reciterId}:${ch.id}:${ayah}`;
      audioTasks.push(async ()=>{
        const cached = await idbGet("audio", key);
        if(!cached){
          const res = await fetch(ayahAudioUrl(reciterId, ch.id, ayah));
          if(res.ok){
            const blob = await res.blob();
            await idbSet("audio", key, blob);
          }
        }
      });
    }
  }
  await runConcurrent(audioTasks, 12, onProgress);
}

$("#downloadAllPagesBtn").addEventListener("click", async ()=>{
  const btn = $("#downloadAllPagesBtn");
  const percentText = $("#pagesPercent");
  const barWrap = $("#pagesBarWrap");
  const barFill = $("#pagesBarFill");
  
  const ready = await openIDB().then(()=>true).catch(()=>false);
  if(!ready){ toast("التخزين غير متاح في هذا المتصفح"); return; }
  
  const ok = await customConfirm("سيتم تنزيل الخطوط وجميع صفحات المصحف (٦٠٤ صفحة) لتعمل بدون إنترنت بالكامل بسرعة فائقة. متابعة؟", "تنزيل كامل المصحف");
  if(!ok) return;

  btn.disabled = true;
  barWrap.classList.add("show");
  barFill.style.width = "0%";
  try{
    await downloadAllPages((done, total)=>{
      const pct = Math.round((done/total)*100);

    });

  }catch(e){
    toast("تعذّر إكمال التنزيل، تحقق من اتصالك وحاول مجدداً");
  }finally{
    btn.disabled = false;
  }
});

$("#downloadAllAudioBtn").addEventListener("click", async ()=>{
  const btn = $("#downloadAllAudioBtn");
  const percentText = $("#audioPercent");
  const barWrap = $("#audioBarWrap");
  const barFill = $("#audioBarFill");
  
  const ready = await openIDB().then(()=>true).catch(()=>false);

  }catch(e){

/* ================= SETTINGS DRAWER ================= */
function openDrawer(){
  $("#settingsOverlay").classList.remove("hidden");
  $("#settingsDrawer").classList.remove("hidden");
  requestAnimationFrame(()=>$("#settingsDrawer").classList.remove("slide-out"));
}
function closeDrawer(){
  $("#settingsDrawer").classList.add("slide-out");
  setTimeout(()=>{
    $("#settingsOverlay").classList.add("hidden");
    $("#settingsDrawer").classList.add("hidden");
  }, 240);
}
$("#settingsBtn").addEventListener("click", openDrawer);
$("#closeDrawerBtn").addEventListener("click", closeDrawer);
$("#settingsOverlay").addEventListener("click", closeDrawer);

function populateReciterSelect(){
  const sel = $("#reciterSelect");
  sel.innerHTML = RECITERS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
  sel.value = state.reciter;
  sel.addEventListener("change", ()=>{
    state.reciter = sel.value;
    storage.set("qm_reciter", state.reciter);
    stopAudio();
    toast("تم تغيير القارئ إلى: " + (RECITERS.find(r=>r.id===state.reciter)||{}).name);
  });
}

function initNightMode(){
  const sw = $("#nightModeToggle");
  sw.classList.toggle("on", state.night);
  applyTheme();
  sw.addEventListener("click", ()=>{
    state.night = !state.night;
    sw.classList.toggle("on", state.night);
    storage.set("qm_night", state.night ? "1":"0");
    applyTheme();
  });
}

$("#clearCacheBtn").addEventListener("click", async ()=>{
  const ok = await customConfirm("سيتم حذف جميع الصفحات والأصوات والخطوط المحفوظة بدون إنترنت من هذا الجهاز. متابعة؟", "مسح البيانات");
  if(!ok) return;

  storage.keys().forEach(k=>{
    if(k.startsWith("qm_cache_") || k.startsWith("qm_qcf_")) storage.remove(k);
  });
  await idbClear("pages");
  await idbClear("audio");
  await idbClear("meta");
  await idbClear("fonts");
  $("#pagesPercent").textContent = "⬇";
  $("#audioPercent").textContent = "⬇";
  $("#pagesBarWrap").classList.remove("show");
  $("#audioBarWrap").classList.remove("show");
  toast("تم مسح البيانات المحفوظة");
});

  applyTheme();

/* ================= INLINE SERVICE WORKER (دمج كود sw.js بالكامل بدون ملفات إضافية) ================= */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    const swInlineCode = `
      const CACHE_NAME = 'qm-pwa-cache-v2';
      const STATIC_ASSETS = ['./', './index.html', './icon-192.png', './icon-512.png'];

      self.addEventListener('install', (e) => {
        e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(STATIC_ASSETS).catch(()=>{})));
        self.skipWaiting();
      });

      self.addEventListener('activate', (e) => {
        e.waitUntil(
          caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))))
        );
        self.clients.claim();
      });

      self.addEventListener('fetch', (e) => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then((cached) => {
            if (cached) return cached;
            return fetch(e.request).then((res) => {
              if (!res || res.status !== 200) return res;
              const resClone = res.clone();
              caches.open(CACHE_NAME).then((cache) => cache.put(e.request, resClone));
              return res;
            }).catch(() => cached);
          })
        );
      });
    `;

    try {
      const swBlob = new Blob([swInlineCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {
        navigator.serviceWorker.register(swUrl, { scope: "./" }).catch(() => {});
      });
    } catch(e) {}
  });
}
})();
