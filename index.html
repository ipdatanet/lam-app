<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>القرآن المبين</title>
<meta name="theme-color" content="#0e3b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="القرآن المبين — تطبيق قرآني لقراءة واستماع القرآن الكريم برواية حفص عن عاصم">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e3b36;
    --ink-2:#123f3a;
    --gold:#c9a24b;
    --gold-soft:#e7cf8f;
    --parchment:#f6efdc;
    --parchment-2:#efe4c6;
    --card:#ffffff;
    --text-main:#1c2b28;
    --text-muted:#5b6d68;
    --line:#e2d6b0;
    --shadow: 0 10px 30px rgba(14,59,54,.10);
    --radius:16px;
    --mushaf-size:19px;
    --mushaf-line:2.35;
    color-scheme: light;
  }
  html.night{
    --ink:#07211e;
    --ink-2:#0a2925;
    --parchment:#101917;
    --parchment-2:#152220;
    --card:#152220;
    --text-main:#eee6cf;
    --text-muted:#93a29c;
    --line:#2a3733;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--parchment);
    color:var(--text-main);
    overflow-x:hidden;
    transition:background .25s ease,color .25s ease;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a,button{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;color:inherit;}

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(160deg,var(--ink),var(--ink-2));
    position:sticky;top:0;z-index:30;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  .header-inner{
    position:relative;
    max-width:900px;margin:0 auto;
    padding:14px 16px;
    display:flex;align-items:center;justify-content:center;
    min-height:52px;
  }
  .header-inner h1{
    margin:0;font-size:19px;font-weight:800;color:var(--gold-soft);
    letter-spacing:.5px;text-align:center;
  }
  .header-inner .sub{display:block;font-size:11px;font-weight:400;color:#cfe3df;opacity:.75;margin-top:2px;}
  .icon-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold-soft);font-size:19px;
    background:rgba(255,255,255,.06);
    transition:background .15s ease;
  }
  .icon-btn:hover{background:rgba(255,255,255,.14);}
  #settingsBtn{right:10px;}
  #backBtn{left:10px;font-size:20px;}
  #bookmarkBtn{right:10px;font-size:18px;}
  #bookmarkBtn.marked{color:var(--gold);}

  /* ---------- Home ---------- */
  #homeView{max-width:900px;margin:0 auto;width:100%;padding:16px 14px 60px;flex:1;}
  .tabs{
    display:flex;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:5px;margin:6px 0 14px;box-shadow:var(--shadow);
  }
  .tab-btn{
    flex:1;padding:10px 8px;border-radius:999px;font-weight:700;font-size:14.5px;
    color:var(--text-muted);transition:all .2s ease;
  }
  .tab-btn.active{background:var(--ink);color:var(--gold-soft);}

  .resume-card{margin-bottom:14px;}
  .resume-inner{
    width:100%;display:flex;align-items:center;gap:12px;
    background:var(--ink);color:var(--gold-soft);border-radius:var(--radius);
    padding:12px 14px;box-shadow:var(--shadow);text-align:right;
  }
  .resume-icon{font-size:20px;flex:none;}
  .resume-text{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .resume-title{font-weight:800;font-size:14px;}
  .resume-sub{font-size:12px;color:#cfe3df;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .grid{display:flex;flex-direction:column;gap:10px;}
  .hidden{display:none !important;}

  .sections-scroller{
    display:flex;flex-direction:row;overflow-x:auto;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
    height:calc(100vh - 165px);
  }
  .section-panel{
    flex:0 0 100%;width:100%;box-sizing:border-box;scroll-snap-align:start;
    height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;
  }

  .surah-card, .juz-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;display:flex;align-items:center;gap:10px;
    box-shadow:var(--shadow);transition:transform .15s ease, border-color .15s ease;
    text-align:right;
  }
  .surah-card:active, .juz-card:active{transform:scale(.97);}
  .surah-card:hover, .juz-card:hover{border-color:var(--gold);}
  .badge{
    flex:none;width:38px;height:38px;border-radius:10px;
    background:var(--ink);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;position:relative;
  }
  .badge::before{
    content:"";position:absolute;inset:3px;border:1px solid rgba(201,162,75,.5);border-radius:7px;
  }
  .s-info{flex:1;min-width:0;}
  .s-name{display:block;font-family:'Tajawal',sans-serif;font-weight:800;font-size:16px;color:var(--text-main);}
  .s-meta{display:block;font-size:12px;color:var(--text-muted);margin-top:4px;}
  .s-range{display:block;font-size:12px;color:var(--gold);margin-top:4px;font-weight:700;}
  .empty-msg{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--text-muted);font-size:14px;}
  .load-msg{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--text-muted);font-size:14px;}
  .load-msg .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);
    margin:0 auto 10px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Reader ---------- */
  #readerView{max-width:820px;margin:0 auto;width:100%;padding:0 0 110px;flex:1;}
  .audio-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:25;
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -6px 22px rgba(0,0,0,.14);
    display:flex;align-items:center;justify-content:center;gap:16px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .ab-btn{
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--text-main);background:var(--parchment-2);
    border:1px solid var(--line);
  }
  .ab-btn:hover{border-color:var(--gold);}
  .ab-btn.ab-main{
    width:56px;height:56px;font-size:20px;
    background:var(--ink);color:var(--gold-soft);border-color:var(--ink);
  }
  .ab-btn.active{background:var(--gold);color:#2b2308;border-color:var(--gold);}

  .mushaf{
    background:var(--card);width:100%;
    display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;
  }
  .mushaf > .load-msg, .mushaf > .empty-msg{flex:0 0 100%;width:100%;}
  .qcf-page{
    flex:0 0 100%;width:100%;box-sizing:border-box;scroll-snap-align:start;
    padding:18px 16px 22px;display:flex;flex-direction:column;
    min-height:calc(100vh - 200px);overflow:hidden;
  }
  .qcf-page-num{
    text-align:center;font-size:11px;color:var(--text-muted);margin:0 0 10px;flex:none;
    font-family:'Tajawal',sans-serif;
  }
  .qcf-page-num::before, .qcf-page-num::after{content:"—";color:var(--gold);margin:0 8px;opacity:.6;}
  .qcf-lines{display:flex;flex-direction:column;justify-content:flex-start;}
  .qcf-line{
    direction:rtl;unicode-bidi:bidi-override;text-align:center;
    line-height:calc((100vh - 230px) / 15);margin:0 auto;white-space:nowrap;overflow:visible;
    max-width:100%;font-size:var(--mushaf-size);
  }
  .qcf-line.qcf-line-center{margin:4px auto;font-size:calc(var(--mushaf-size) * 1.15);}
  .qcf-word{
    font-size:inherit;color:var(--text-main);cursor:pointer;
    border-radius:6px;transition:background .2s ease;padding:0 1px;
  }
  .qcf-word:hover{background:var(--parchment-2);}
  .qcf-word.playing{background:var(--gold-soft);color:#2b2308;}
  html.night .qcf-word.playing{background:#5a4a1c;color:#f5e6b0;}
  .qcf-line-center .qcf-word{cursor:default;}

  /* ---------- Settings drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(6,20,18,.5);z-index:40;backdrop-filter:blur(1px);
  }
  .drawer{
    position:fixed;top:0;bottom:0;right:0;width:min(94vw,440px);z-index:50;
    background:var(--parchment);box-shadow:-8px 0 30px rgba(0,0,0,.25);
    padding:20px 18px 24px;overflow-y:auto;
    transform:translateX(0);transition:transform .28s ease;
  }
  .drawer.slide-out{transform:translateX(110%);}
  .drawer h2{margin:0 0 18px;font-size:18px;color:var(--text-main);display:flex;justify-content:space-between;align-items:center;}
  .drawer .close-x{font-size:22px;color:var(--text-muted);}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:8px;}
  .field .hint{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.6;}
  select, .drawer input[type=range]{width:100%;}
  select{
    padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--text-main);font-size:13.5px;
  }
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .switch{position:relative;width:44px;height:24px;background:var(--line);border-radius:99px;transition:.2s;flex:none;}
  .switch::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;}
  .switch.on{background:var(--ink);}
  .switch.on::after{right:22px;}
  .drawer-btn{
    width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--text-main);font-weight:700;font-size:13.5px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .drawer-btn.primary{background:var(--ink);color:var(--gold-soft);border-color:var(--ink);}
  .drawer-btn.danger{color:#b6462f;}
  .progress-wrap{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px;display:none;}
  .progress-wrap.show{display:block;}
  .progress-bar{height:100%;width:0%;background:var(--gold);transition:width .2s;}
  .dl-row{display:flex;align-items:center;gap:12px;}
  .progress-circle{position:relative;width:50px;height:50px;flex:none;display:none;}
  .progress-circle.show{display:block;}
  .progress-circle svg{width:100%;height:100%;transform:rotate(-90deg);}
  .pc-bg{fill:none;stroke:var(--line);stroke-width:5;}
  .pc-fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;
    stroke-dasharray:163.36;stroke-dashoffset:163.36;transition:stroke-dashoffset .2s ease;}
  .pc-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:800;color:var(--text-main);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#f4ead0;padding:11px 18px;border-radius:99px;
    font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:88vw;text-align:center;
  }

  ::selection{background:var(--gold-soft);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-inner">
      <button id="backBtn" class="icon-btn hidden" title="رجوع">➜</button>
      <h1 id="appTitle">القرآن المبين</h1>
      <button id="settingsBtn" class="icon-btn" title="الإعدادات">⚙</button>
      <button id="bookmarkBtn" class="icon-btn hidden" title="حفظ العلامة المرجعية">🔖</button>
    </div>
  </header>

  <!-- HOME -->
  <main id="homeView">
    <div class="tabs">
      <button class="tab-btn active" data-tab="surah">السور</button>
      <button class="tab-btn" data-tab="juz">الأجزاء</button>
    </div>
    <div id="resumeCard" class="resume-card hidden"></div>
    <div id="sectionsScroller" class="sections-scroller">
      <div class="section-panel" data-panel="surah">
        <div id="surahGrid" class="grid">
          <div class="load-msg"><div class="spinner"></div>جاري تحميل قائمة السور…</div>

  <!-- READER -->
  <main id="readerView" class="hidden">
    <div id="mushafContainer" class="mushaf">

    </div>

  <div id="audioBar" class="audio-bar hidden">

    <button id="prevBtn" class="ab-btn" title="الآية السابقة">⏮</button>
  </div>

  <div id="settingsOverlay" class="overlay hidden"></div>
  <aside id="settingsDrawer" class="drawer hidden slide-out">
    <h2>الإعدادات <button class="close-x" id="closeDrawerBtn">✕</button></h2>

    <div class="field">
      <label>القارئ</label>
      <select id="reciterSelect"></select>
    </div>

    <div class="field row-between">
      <label style="margin:0;">الوضع المظلم</label>
      <button id="nightModeToggle" class="switch"></button>
    </div>

    <div class="field">
      <label>تنزيل كامل المصحف للعمل بدون إنترنت</label>
      <div class="dl-row">
        <button id="downloadAllPagesBtn" class="drawer-btn" style="flex:1;margin-bottom:0;">⬇ تنزيل كل الصفحات (٦٠٤)</button>
        <div class="progress-circle" id="pagesCircle">
          <svg viewBox="0 0 60 60"><circle class="pc-bg" cx="30" cy="30" r="26"/><circle class="pc-fg" id="pagesRing" cx="30" cy="30" r="26"/></svg>
          <span class="pc-label" id="pagesLabel">٠٪</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>تنزيل صوت القارئ الحالي لكل القرآن</label>
      <div class="dl-row">
        <button id="downloadAllAudioBtn" class="drawer-btn" style="flex:1;margin-bottom:0;">🎧 تنزيل كل الآيات (٦٢٣٦)</button>
        <div class="progress-circle" id="audioCircle">
          <svg viewBox="0 0 60 60"><circle class="pc-bg" cx="30" cy="30" r="26"/><circle class="pc-fg" id="audioRing" cx="30" cy="30" r="26"/></svg>
          <span class="pc-label" id="audioLabel">٠٪</span>
        </div>
      </div>
    </div>

    <div class="field">
      <button id="clearCacheBtn" class="drawer-btn danger">🗑 مسح كل البيانات المحفوظة في الجهاز</button>
    </div>
  </aside>

  <audio id="audioPlayer" preload="none"></audio>
  <div id="toast" class="toast hidden"></div>
</div>

<script>
(function(){
"use strict";

/* ================= SAFE STORAGE ================= */
// In sandboxed preview iframes (or private browsing) localStorage access can
// throw a SecurityError. Falling back to an in-memory store keeps the app
// working (just without persistence) instead of crashing the whole script.
const memoryStore = {};
const storage = {
  get(key){
    try{ return window.localStorage.getItem(key); }
    catch(e){ return Object.prototype.hasOwnProperty.call(memoryStore,key) ? memoryStore[key] : null; }
  },
  set(key, val){
    try{ window.localStorage.setItem(key, val); return true; }
    catch(e){ memoryStore[key] = val; return false; }
  },
  remove(key){
    try{ window.localStorage.removeItem(key); }
    catch(e){ delete memoryStore[key]; }
  },
  keys(){
    try{ return Object.keys(window.localStorage); }
    catch(e){ return Object.keys(memoryStore); }
  }
};

/* ================= OFFLINE STORAGE (IndexedDB) ================= */
// localStorage tops out around 5-10MB, nowhere near enough for 604 Mushaf
// pages plus thousands of audio files, so full offline download uses
// IndexedDB instead, which supports much larger quotas and raw Blobs.
const IDB_NAME = "qm_offline_db";
const IDB_VERSION = 1;
let idbPromise = null;

function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("indexedDB not available")); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("pages")) db.createObjectStore("pages");
      if(!db.objectStoreNames.contains("audio")) db.createObjectStore("audio");
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return idbPromise;
}

async function idbGet(storeName, key){
  try{
    const db = await openIDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readonly");
      const req = tx.objectStore(storeName).get(key);
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return undefined; }
}

async function idbSet(storeName, key, val){
  try{
    const db = await openIDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).put(val, key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ return false; }
}

async function idbClear(storeName){
  try{
    const db = await openIDB();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(storeName, "readwrite");
      tx.objectStore(storeName).clear();
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ return false; }
}

/* ================= DATA ================= */

// 14 reciters, everyayah.com folder ids -> Arabic display names
const RECITERS = [
  {id:"Alafasy_128kbps", name:"مشاري راشد العفاسي"},
  {id:"Abdul_Basit_Murattal_192kbps", name:"عبد الباسط عبد الصمد (مرتل)"},
  {id:"Abdul_Basit_Mujawwad_128kbps", name:"عبد الباسط عبد الصمد (مجوّد)"},
  {id:"Husary_128kbps", name:"محمود خليل الحصري"},
  {id:"Husary_Muallim_128kbps", name:"الحصري (معلّم)"},
  {id:"Minshawy_Murattal_128kbps", name:"محمد صديق المنشاوي (مرتل)"},
  {id:"Minshawy_Mujawwad_192kbps", name:"محمد صديق المنشاوي (مجوّد)"},
  {id:"Ghamadi_40kbps", name:"سعد الغامدي"},
  {id:"Saood_ash-Shuraym_128kbps", name:"سعود الشريم"},
  {id:"Hudhaify_128kbps", name:"علي بن عبد الرحمن الحذيفي"},
  {id:"Muhammad_Jibreel_128kbps", name:"محمد جبريل"},
  {id:"Ahmed_ibn_Ali_al-Ajamy_128kbps", name:"أحمد بن علي العجمي"},
  {id:"Ayman_Sowaid_64kbps", name:"أيمن سويد"},
  {id:"MaherAlMuaiqly128kbps", name:"ماهر المعيقلي"}
];

const JUZ_COUNT = 30;

// QCF v4 Mushaf dataset (Madinah Mushaf 1441 AH, Hafs 'an 'Asim) — MohamadHajjRabee/quran-qcf4
const QCF_MIRRORS = [
  "https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main",
  "https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main"
];
const QCF_FONT_CDN = "https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@main/fonts-woff2";

async function fetchQcfJson(path){
  const errors = [];
  for(const base of QCF_MIRRORS){
    try{
      const res = await fetch(`${base}/${path}`);
      if(!res.ok){
        errors.push(`${base}: HTTP ${res.status}`);
        continue;
      }
      return await res.json();
    }catch(e){
      errors.push(`${base}: ${e.message || e}`);
      console.warn("QCF fetch failed, trying next mirror:", base, path, e);
    }
  }
  const err = new Error(`تعذّر جلب ${path} — ${errors.join(" | ")}`);
  err.details = errors;
  throw err;

const QCF_HAFS_FONT_COUNT = 47;

function pad2(n){ return String(n).padStart(2,"0"); }

// Injects @font-face rules for all QCF4 glyph fonts. Browsers only download
// a given font file once it's actually used to render a character, so this
// is safe to do once up-front rather than tracking per-page font usage.
function registerQcfFonts(){
  let css = "";
  for(let i=1;i<=QCF_HAFS_FONT_COUNT;i++){
    const name = `QCF4_Hafs_${pad2(i)}`;
    css += `@font-face{font-family:'${name}';src:url('${QCF_FONT_CDN}/${name}_W.woff2') format('woff2');font-display:swap;}\n`;
  }
  css += `@font-face{font-family:'QCF4_QBSML';src:url('${QCF_FONT_CDN}/QCF4_QBSML.woff2') format('woff2');font-display:swap;}\n`;
  const style = document.createElement("style");
  style.textContent = css;
  document.head.appendChild(style);
}

/* ================= READER: FETCH & RENDER ================= */

async function openReader(mode, number, scrollToPage){
  showReader();
  state.currentMode = mode;
  state.currentNumber = number;
  stopAudio();
  $("#mushafContainer").innerHTML = `<div class="load-msg"><div class="spinner"></div>جاري التحميل…</div>`;

  try{
    await loadQcfIndex();

    let title, pageStart, pageEnd;
    if(mode === "surah"){
      const ch = state.qcfIndex.chapters.find(c=>c.id===number);
      title = ch.name_arabic;
      pageStart = ch.pages[0]; pageEnd = ch.pages[1];
    } else {
      await loadQcfVerses();
      const [startKey, endKey] = JUZ_BOUNDS[number];
      title = `الجزء ${toArabicDigits(number)}`;
      pageStart = state.qcfVerses[startKey].page;
      pageEnd = state.qcfVerses[endKey].page;
    }

    const ck = cacheKey(mode, number);
    let pages = null;
    const cachedRaw = storage.get(ck);
    if(cachedRaw){
      try{
        const parsed = JSON.parse(cachedRaw);
        if(Array.isArray(parsed.pages) && parsed.pages.length && parsed.pages[0] && Array.isArray(parsed.pages[0].lines)){
          pages = parsed.pages;
        } else {
          throw new Error("stale cache shape");
        }
      }catch(e){
        console.warn("Discarding incompatible cached entry:", ck, e);
        storage.remove(ck);
        pages = null;
      }
    }
    if(!pages){
      const nums = [];
      for(let p=pageStart;p<=pageEnd;p++) nums.push(p);
      pages = await Promise.all(nums.map(async p=>{
        const cached = await idbGet("pages", p);
        if(cached) return cached;
        const data = await fetchQcfJson(`pages/${pad3(p)}.json`);
        idbSet("pages", p, data);
        return data;
      }));
    }

    state.currentTitle = title;
    state.currentPages = pages;
    renderQcfPages(pages);
    state.currentVisiblePage = scrollToPage || pageStart;
    updateReciterTag();
    updateBookmarkBtn();
    if(scrollToPage){
      const target = document.querySelector(`.qcf-page[data-page="${scrollToPage}"]`);
      if(target) target.scrollIntoView({behavior:"auto", inline:"start", block:"nearest"});
    }
  }catch(err){
    console.error("openReader failed:", err);
    $("#mushafContainer").innerHTML = `
      <div class="empty-msg">
        تعذّر تحميل صفحات المصحف. تحقق من اتصالك بالإنترنت ثم حاول مرة أخرى.
        <br><button id="retryOpenBtn" class="drawer-btn" style="margin-top:14px;max-width:220px;margin-inline:auto;">إعادة المحاولة</button>
        <div style="margin-top:14px;font-size:11px;color:var(--text-muted);direction:ltr;text-align:center;word-break:break-word;">${(err && err.message) ? err.message : String(err)}</div>
      </div>`;
    const retryBtn = document.getElementById("retryOpenBtn");
    if(retryBtn) retryBtn.addEventListener("click", ()=>openReader(mode, number, scrollToPage));
  }
}

function renderQcfPages(pages){
  const box = $("#mushafContainer");
  const ayahs = [];          // ordered unique verse list for playback
  const ayahIndexByKey = {}; // verse_key -> index in ayahs

  let html = "";
  pages.forEach(page=>{
    html += `<div class="qcf-page" data-page="${page.page}">`;
    html += `<div class="qcf-page-num">صفحة ${toArabicDigits(page.page)}</div>`;
    html += `<div class="qcf-lines">`;
    page.lines.forEach(line=>{
      const isSpecial = line.words.length && (line.words[0].type === "surah_header" || line.words[0].type === "bismillah");
      html += `<div class="qcf-line${isSpecial?" qcf-line-center":""}">`;
      line.words.forEach(word=>{
        const verseAttr = word.verse_key ? ` data-verse="${word.verse_key}"` : "";
        html += `<span class="qcf-word" style="font-family:'${word.font}'"${verseAttr}>${word.char}</span> `;
        if(word.verse_key && word.type === "word"){
          if(!(word.verse_key in ayahIndexByKey)){
            const [sNo, aNo] = word.verse_key.split(":").map(Number);
            ayahIndexByKey[word.verse_key] = ayahs.length;
            ayahs.push({surahNo:sNo, ayahNo:aNo, key:word.verse_key, text:""});
          }
          ayahs[ayahIndexByKey[word.verse_key]].text += word.text + " ";
        }
      });
      html += `</div>`;
    });
    html += `</div></div>`;
  });

  box.innerHTML = html;
  state.currentAyahs = ayahs;
  observeVisiblePages(box);
}

let pageObserver = null;
function observeVisiblePages(box){
  if(pageObserver) pageObserver.disconnect();
  pageObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6){
        state.currentVisiblePage = parseInt(entry.target.dataset.page, 10);
        updateBookmarkBtn();
      }
    });
  }, {root: box, threshold: 0.6});
  box.querySelectorAll(".qcf-page").forEach(p=>pageObserver.observe(p));
}

const audioEl = $("#audioPlayer");

function updateReciterTag(){
  // reciter name display removed from the reader UI
}

async function playFromIndex(idx){
  if(idx<0 || idx>=state.currentAyahs.length) return;
  state.playIndex = idx;
  const a = state.currentAyahs[idx];
  const key = `${state.reciter}:${a.surahNo}:${a.ayahNo}`;

  if(state.currentBlobUrl){ URL.revokeObjectURL(state.currentBlobUrl); state.currentBlobUrl = null; }

  let src = ayahAudioUrl(state.reciter, a.surahNo, a.ayahNo);
  const blob = await idbGet("audio", key);
  if(blob){
    src = URL.createObjectURL(blob);
    state.currentBlobUrl = src;
  }

  audioEl.src = src;
  audioEl.play().catch(()=>{ toast("تعذّر تشغيل الصوت لهذه الآية"); });
  highlightPlaying(idx);
  state.isPlaying = true;
  $("#playPauseBtn").textContent = "❚❚";
  showAudioBar();
}

function highlightPlaying(idx){
  $$(".qcf-word.playing").forEach(el=>el.classList.remove("playing"));
  const a = state.currentAyahs[idx];
  if(!a) return;
  const els = document.querySelectorAll(`.qcf-word[data-verse="${a.key}"]`);
  els.forEach(el=>el.classList.add("playing"));
  if(els[0]){
    const pageEl = els[0].closest(".qcf-page");
    if(pageEl) pageEl.scrollIntoView({behavior:"smooth", inline:"start", block:"nearest"});
  }
}

audioEl.addEventListener("ended", async ()=>{
  if(state.repeat){
    playFromIndex(state.playIndex);
    return;
  }
  if(state.playIndex+1 < state.currentAyahs.length){
    playFromIndex(state.playIndex+1);
    return;
  }
  if(state.currentMode === "surah" && state.currentNumber < 114){
    const nextNum = state.currentNumber + 1;
    toast("جاري الانتقال إلى السورة التالية…");
    await openReader("surah", nextNum);
    playFromIndex(0);
  } else {
    state.isPlaying = false;
    $("#playPauseBtn").textContent = "▶";
    toast("انتهت التلاوة");
  }
});

function stopAudio(){
  audioEl.pause();
  audioEl.removeAttribute("src");
  state.isPlaying = false;
  state.playIndex = -1;
  $("#playPauseBtn").textContent = "▶";
  $$(".qcf-word.playing").forEach(el=>el.classList.remove("playing"));
}

$("#playPauseBtn").addEventListener("click", ()=>{
  if(!state.currentAyahs.length) return;
  if(state.isPlaying){
    audioEl.pause();
    state.isPlaying = false;
    $("#playPauseBtn").textContent = "▶";
  } else if(state.playIndex >=0 && audioEl.src){
    audioEl.play();
    state.isPlaying = true;
    $("#playPauseBtn").textContent = "❚❚";
  } else {
    playFromIndex(0);
  }
});

$("#nextBtn").addEventListener("click", ()=>{
  if(!state.currentAyahs.length) return;
  if(state.playIndex+1 < state.currentAyahs.length){
    playFromIndex(state.playIndex+1);
  } else {
    toast("هذه آخر آية");
  }
});

$("#prevBtn").addEventListener("click", ()=>{
  if(!state.currentAyahs.length) return;
  if(state.playIndex > 0){
    playFromIndex(state.playIndex-1);
  } else if(state.playIndex === 0){
    playFromIndex(0);
  } else {
    toast("افتح آية أولًا");
  }
});

$("#repeatBtn").addEventListener("click", ()=>{
  state.repeat = !state.repeat;
  $("#repeatBtn").classList.toggle("active", state.repeat);
  toast(state.repeat ? "تكرار الآية: مفعّل" : "تكرار الآية: متوقف");
});

function downloadTextFile(){
  if(!state.currentAyahs.length){ toast("افتح سورة أولًا"); return; }
  let text = `${state.currentTitle}\n${"=".repeat(20)}\n\n`;
  state.currentAyahs.forEach(a=>{
    if(a.surahNameAr) text += `\n[سورة ${a.surahNameAr}]\n`;
    text += `(${a.ayahNo}) ${a.text}\n`;
  });
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${state.currentTitle.replace(/\s+/g,"_")}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  toast("تم تنزيل النص");
}

const TOTAL_PAGES = 604;
const TOTAL_AYAHS = 6236;

function setCircleProgress(ringId, labelId, percent){
  const ring = document.getElementById(ringId);
  const label = document.getElementById(labelId);
  const circumference = 163.36; // 2 * PI * r(26)
  if(ring) ring.style.strokeDashoffset = String(circumference * (1 - percent/100));
  if(label) label.textContent = toArabicDigits(Math.round(percent)) + "٪";
}

async function downloadAllPages(onProgress){
  for(let p=1;p<=TOTAL_PAGES;p++){
    const cached = await idbGet("pages", p);
    if(!cached){
      const data = await fetchQcfJson(`pages/${pad3(p)}.json`);
      await idbSet("pages", p, data);
    }
    onProgress(p, TOTAL_PAGES);
  }
}

async function downloadAllAudio(reciterId, onProgress){
  await loadQcfIndex();
  const chapters = state.qcfIndex.chapters;
  let done = 0;
  for(const ch of chapters){
    for(let ayah=1; ayah<=ch.verses_count; ayah++){
      const key = `${reciterId}:${ch.id}:${ayah}`;
      const cached = await idbGet("audio", key);
      if(!cached){
        try{
          const res = await fetch(ayahAudioUrl(reciterId, ch.id, ayah));
          const blob = await res.blob();
          await idbSet("audio", key, blob);
        }catch(e){ /* skip failed ayah, continue */ }
      }
      done++;
      onProgress(done, TOTAL_AYAHS);
    }
  }
}

$("#downloadAllPagesBtn").addEventListener("click", async ()=>{
  const btn = $("#downloadAllPagesBtn");
  const circle = $("#pagesCircle");
  const ready = await openIDB().then(()=>true).catch(()=>false);
  if(!ready){ toast("التخزين غير متاح في هذا المتصفح"); return; }
  if(!confirm("سيتم تنزيل 604 صفحة (كامل المصحف) لتصفحها بدون إنترنت. قد يستغرق هذا عدة دقائق. متابعة؟")) return;
  btn.disabled = true;
  circle.classList.add("show");
  setCircleProgress("pagesRing","pagesLabel",0);
  try{
    await downloadAllPages((done,total)=>setCircleProgress("pagesRing","pagesLabel",(done/total)*100));
    toast("تم تنزيل جميع صفحات المصحف (٦٠٤ صفحة) للقراءة بدون إنترنت");
  }catch(e){
    console.error("downloadAllPages failed:", e);
    toast("تعذّر إكمال تنزيل الصفحات، تحقق من اتصالك وحاول مرة أخرى");
  }finally{
    btn.disabled = false;
  }
});

$("#downloadAllAudioBtn").addEventListener("click", async ()=>{
  const btn = $("#downloadAllAudioBtn");
  const circle = $("#audioCircle");
  const ready = await openIDB().then(()=>true).catch(()=>false);
  if(!ready){ toast("التخزين غير متاح في هذا المتصفح"); return; }
  const rname = (RECITERS.find(r=>r.id===state.reciter)||{}).name || state.reciter;
  if(!confirm(`سيتم تنزيل صوت القارئ (${rname}) لكل آيات القرآن (٦٢٣٦ آية). هذا سيستغرق وقتًا طويلًا ومساحة تخزين كبيرة على جهازك. متابعة؟`)) return;
  btn.disabled = true;
  circle.classList.add("show");
  setCircleProgress("audioRing","audioLabel",0);
  try{
    await downloadAllAudio(state.reciter, (done,total)=>setCircleProgress("audioRing","audioLabel",(done/total)*100));
    toast(`تم تنزيل صوت القارئ (${rname}) لكل القرآن للاستماع بدون إنترنت`);
  }catch(e){
    console.error("downloadAllAudio failed:", e);
    toast("تعذّر إكمال تنزيل الصوت، تحقق من اتصالك وحاول مرة أخرى");
  }finally{
    btn.disabled = false;
  }
});

/* ================= SETTINGS DRAWER ================= */

function openDrawer(){
  $("#settingsOverlay").classList.remove("hidden");
  $("#settingsDrawer").classList.remove("hidden");
  requestAnimationFrame(()=>$("#settingsDrawer").classList.remove("slide-out"));
}
function closeDrawer(){
  $("#settingsDrawer").classList.add("slide-out");
  setTimeout(()=>{
    $("#settingsOverlay").classList.add("hidden");
    $("#settingsDrawer").classList.add("hidden");
  }, 260);
}
$("#settingsBtn").addEventListener("click", openDrawer);
$("#closeDrawerBtn").addEventListener("click", closeDrawer);
$("#settingsOverlay").addEventListener("click", closeDrawer);

function populateReciterSelect(){
  const sel = $("#reciterSelect");
  sel.innerHTML = RECITERS.map(r=>`<option value="${r.id}">${r.name}</option>`).join("");
  sel.value = state.reciter;
  sel.addEventListener("change", ()=>{
    state.reciter = sel.value;
    storage.set("qm_reciter", state.reciter);
    updateReciterTag();
    stopAudio();
    toast("تم تغيير القارئ إلى: " + (RECITERS.find(r=>r.id===state.reciter)||{}).name);
  });
}

function initNightMode(){
  const sw = $("#nightModeToggle");
  sw.classList.toggle("on", state.night);
  applyTheme();
  sw.addEventListener("click", ()=>{
    state.night = !state.night;
    sw.classList.toggle("on", state.night);
    storage.set("qm_night", state.night ? "1":"0");
    applyTheme();
  });
}

$("#clearCacheBtn").addEventListener("click", async ()=>{
  if(!confirm("سيتم حذف جميع الصفحات والأصوات المحفوظة بدون إنترنت من هذا الجهاز. متابعة؟")) return;
  storage.keys().forEach(k=>{
    if(k.startsWith("qm_cache_")) storage.remove(k);
  });
  await idbClear("pages");
  await idbClear("audio");
  setCircleProgress("pagesRing","pagesLabel",0);
  setCircleProgress("audioRing","audioLabel",0);
  $("#pagesCircle").classList.remove("show");
  $("#audioCircle").classList.remove("show");
  toast("تم مسح البيانات المحفوظة");
});

/* ================= INIT ================= */

function init(){
  applyTheme();
  registerQcfFonts();
  populateReciterSelect();
  initNightMode();
  updateReciterTag();
  renderJuzGrid();
  loadSurahList();
  renderResumeCard();
  $("#mushafContainer").addEventListener("click", onMushafClick);
  // Ask the browser not to auto-evict this site's storage under pressure —
  // without this, settings like night mode can silently reset between
  // launches on some browsers/devices even though the save itself worked.
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(()=>{});
  }
}

init();

// Register the service worker so the app itself (not just downloaded Quran
// data) loads with no internet connection after the first visit.
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch((e)=>{
      console.warn("Service worker registration failed:", e);
    });
  });
}
})();
</script>
