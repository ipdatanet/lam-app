<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>القرآن المبين</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #F7F1E1;
  --surface: #FFFDF8;
  --surface-2: #FBF4E4;
  --border: #E4D7B4;
  --text: #26261F;
  --text-muted: #8A7F68;
  --primary: #14532D;
  --gold: #B8860B;
  --gold-soft: #F1E2B8;
  --shadow: 0 6px 24px rgba(38, 38, 31, 0.08);
}
html.dark {
  --bg: #0A120D;
  --surface: #101C14;
  --surface-2: #16241A;
  --border: #26362B;
  --text: #EDE7D6;
  --text-muted: #8F9C90;
  --primary: #2E9E5B;
  --gold: #E3C567;
  --gold-soft: #26301B;
  --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Cairo', system-ui, sans-serif; direction: rtl;
  -webkit-tap-highlight-color: transparent;
}
body.player-active { overflow: hidden; height: 100vh; }
button { font-family: inherit; }
a { color: inherit; text-decoration: none; }

.view { display: none; }
.view.active { display: block; }

.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px;
  background: linear-gradient(180deg, var(--surface) 0%, transparent 100%);
}
.app-header h1 { font-size: 20px; font-weight: 800; margin: 0; color: var(--primary); }
html.dark .app-header h1 { color: var(--gold); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text);
}
.icon-btn:active { transform: scale(.92); }
.icon-btn svg { width: 20px; height: 20px; }

.tabs { display: flex; gap: 8px; padding: 4px 16px 0; border-bottom: 1px solid var(--border); }
.tab-btn {
  flex: 1; padding: 10px 0 12px; text-align: center;
  border: none; border-bottom: 3px solid transparent;
  background: transparent; color: var(--text-muted);
  font-weight: 700; font-size: 14.5px; cursor: pointer;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
html.dark .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

.list-wrap { padding: 4px 14px 90px; max-width: 640px; margin: 0 auto; }
.list-item {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 14px; margin-bottom: 9px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; cursor: pointer;
}
.list-item:active { transform: scale(.98); }
.badge { flex: none; min-width: 28px; text-align: center; color: var(--primary); font-weight: 700; font-size: 15px; }
html.dark .badge { color: var(--gold); }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 16.5px; margin: 0; }
.item-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.item-chevron { color: var(--text-muted); flex: none; }
.section { display: none; }
.section.active { display: block; }

.loading-state { display: flex; align-items: center; justify-content: center; min-height: 40vh; color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 10px; text-align: center; padding: 0 20px; }

.overlay {
  position: fixed; inset: 0; background: rgba(10,10,8,.45);
  opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 30;
}
.overlay.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; inset: 0; width: 100%;
  background: var(--surface); z-index: 31;
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
}
.drawer.show { transform: translateY(0); }
#reciterOverlay { z-index: 40; }
#reciterSheet { z-index: 41; }
.drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 18px; border-bottom: 1px solid var(--border); }
.drawer-header h2 { margin: 0; font-size: 18px; }
.drawer-body { padding: 14px 18px 40px; overflow-y: auto; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); }
.setting-row .label { font-weight: 600; font-size: 15px; }
.setting-row .hint { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .track { position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer; transition: background .2s; }
.switch .track::before {
  content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; top: 3px; right: 3px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track::before { transform: translateX(-20px); }
.reciter-item { display: flex; align-items: center; gap: 10px; padding: 14px 6px; border-radius: 10px; cursor: pointer; border-bottom: 1px solid var(--border); }
.reciter-item:hover { background: var(--surface-2); }
.reciter-item.selected { color: var(--primary); }
html.dark .reciter-item.selected { color: var(--gold); }
.reciter-item .name { font-size: 15px; font-weight: 600; }
.dl-btn {
  width: 100%; margin-top: 10px; padding: 12px; border: none; border-radius: 12px;
  background: var(--primary); color: #fff; font-weight: 700; font-size: 14.5px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.dl-btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.dl-progress { margin-top: 8px; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
.dl-progress > div { height: 100%; background: var(--gold); width: 0%; transition: width .2s; }
.dl-status { font-size: 12px; color: var(--text-muted); margin-top: 6px; text-align: center; }

/* ---------- شاشة الاستماع (بديل المصحف الرقمي) ---------- */
#playerView { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.player-header {
  flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
}
.player-header .page-info { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.player-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 10px 24px 40px; text-align: center; overflow: hidden;
}
.reciter-avatar {
  width: 172px; height: 172px; border-radius: 50%; flex: none; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 32% 28%, var(--gold-soft), var(--surface-2) 65%);
  border: 1px solid var(--border); box-shadow: var(--shadow);
  transition: box-shadow .3s ease;
}
.reciter-avatar::before {
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  border: 2px solid var(--gold); opacity: .35;
}
.reciter-avatar.playing { box-shadow: 0 0 0 8px var(--gold-soft), var(--shadow); }
.reciter-avatar.playing::before { animation: avatarPulse 1.8s ease-out infinite; }
@keyframes avatarPulse {
  0% { transform: scale(1); opacity: .5; }
  100% { transform: scale(1.22); opacity: 0; }
}
.reciter-avatar svg { width: 74px; height: 74px; color: var(--primary); }
html.dark .reciter-avatar svg { color: var(--gold); }
.eq-bars { position: absolute; bottom: 20px; display: flex; align-items: flex-end; gap: 4px; height: 20px; }
.eq-bars span { width: 4px; border-radius: 2px; background: var(--primary); height: 6px; }
html.dark .eq-bars span { background: var(--gold); }
.reciter-avatar.playing .eq-bars span { animation: eqBounce 0.9s ease-in-out infinite; }
.eq-bars span:nth-child(1) { animation-delay: 0s; }
.eq-bars span:nth-child(2) { animation-delay: .18s; }
.eq-bars span:nth-child(3) { animation-delay: .36s; }
.eq-bars span:nth-child(4) { animation-delay: .54s; }
@keyframes eqBounce { 0%, 100% { height: 6px; } 50% { height: 20px; } }
.player-surah-name { font-size: 24px; font-weight: 800; margin: 4px 0 0; color: var(--primary); }
html.dark .player-surah-name { color: var(--gold); }
.player-reciter-name { font-size: 15px; font-weight: 600; color: var(--text); margin: 0; }
.player-ayah-lbl { font-size: 13px; color: var(--text-muted); margin: 0; }

.controls-bar {
  flex: none; display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 10px 0 max(22px, env(safe-area-inset-bottom));
}
.ctrl-btn {
  width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow);
}
.ctrl-btn svg { width: 18px; height: 18px; }
.ctrl-btn.active { background: var(--gold-soft); border-color: var(--gold); color: var(--primary); }
html.dark .ctrl-btn.active { color: var(--gold); }
.play-fab {
  width: 58px; height: 58px; border-radius: 50%; flex: none;
  background: var(--primary); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(20,83,45,.4); cursor: pointer;
}
.play-fab svg { width: 22px; height: 22px; }
.play-fab.playing { background: var(--gold); box-shadow: 0 8px 20px rgba(184,134,11,.4); }

.back-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text);
}
html.dark .back-btn { color: #fff; }

.retry-btn { padding: 9px 20px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13.5px; }
</style>
</head>
<body>

  <header class="app-header">
    <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

</div>

<script>
/* ============================================================
   القرآن المبين — نسخة استماع فقط (بلا مصحف رقمي QCF4)
   ============================================================ */

function showDebugToast(msg) {
  console.warn("[القرآن المبين]", msg);
}
window.addEventListener("error", (e) => showDebugToast("Error: " + e.message));
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  showDebugToast("Unhandled: " + (r && r.message ? r.message : String(r)));
});

(function checkBrowserSupport() {
  const missing = [];
  if (typeof fetch !== "function") missing.push("fetch");
  if (typeof Promise !== "function") missing.push("Promise");
  if (typeof Map !== "function") missing.push("Map");
  if (missing.length) {
    showDebugToast("المتصفح/الـ WebView المستخدم لا يدعم: " + missing.join(", ") + " — التطبيق يحتاج متصفحًا حديثًا.");
  }
})();

/* تفعيل العمل بلا اتصال: نسجّل Service Worker (مبني من نص مضمَّن داخل هذا
   الملف نفسه، دون ملف خارجي) يخزّن تلقائيًا أي طلب سبق تحميله (بيانات
   السور + الصوت)، ويعيد استخدامه عند انقطاع الإنترنت. إن كانت البيئة
   لا تدعم Service Worker إطلاقًا، يُتجاهل الأمر بصمت دون أي تأثير. */
(function setupOfflineSupport() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const swSource = `
      const CACHE_NAME = "qam-offline-v1";
      self.addEventListener("install", () => self.skipWaiting());
      self.addEventListener("activate", (e) => e.waitUntil(self.clients.claim()));
      self.addEventListener("fetch", (event) => {
        if (event.request.method !== "GET") return;
        event.respondWith((async () => {
          const cache = await caches.open(CACHE_NAME);
          const cached = await cache.match(event.request);
          try {
            const fresh = await fetch(event.request);
            if (fresh && fresh.ok) cache.put(event.request, fresh.clone());
            return fresh;
          } catch (err) {
            if (cached) return cached;
            throw err;
          }
        })());
      });
    `;
    const blob = new Blob([swSource], { type: "application/javascript" });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  } catch (e) {}
})();

/* تخزين آمن: بعض الـ WebView تعطّل DOM Storage فيصبح localStorage نفسه
   null. هذا البديل يستخدم التخزين الحقيقي إن توفر، وإلا الكوكيز، وإلا
   الذاكرة المؤقتة فقط. */
const safeStorage = (function () {
  let available = false;
  try {
    localStorage.setItem("__qam_test__", "1");
    localStorage.removeItem("__qam_test__");
    available = true;
  } catch (e) { available = false; }

  let cookiesAvailable = false;
  try {
    document.cookie = "__qam_test__=1; max-age=60; path=/";
    cookiesAvailable = document.cookie.indexOf("__qam_test__=1") !== -1;
    document.cookie = "__qam_test__=; max-age=0; path=/";
  } catch (e) { cookiesAvailable = false; }

  function cookieGet(key) {
    try {
      const m = document.cookie.match(new RegExp("(?:^|; )" + key + "=([^;]*)"));
      return m ? decodeURIComponent(m[1]) : null;
    } catch (e) { return null; }
  }
  function cookieSet(key, val) {
    try { document.cookie = key + "=" + encodeURIComponent(val) + "; max-age=31536000; path=/"; } catch (e) {}
  }
  function cookieRemove(key) {
    try { document.cookie = key + "=; max-age=0; path=/"; } catch (e) {}
  }

  const mem = {};
  return {
    getItem(key) {
      if (available) { try { return localStorage.getItem(key); } catch (e) {} }
      if (cookiesAvailable) { const v = cookieGet(key); if (v !== null) return v; }
      return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null;
    },
    setItem(key, val) {
      if (available) { try { localStorage.setItem(key, val); return; } catch (e) {} }
      if (cookiesAvailable) { cookieSet(key, val); return; }
      mem[key] = String(val);
    },
    removeItem(key) {
      if (available) { try { localStorage.removeItem(key); return; } catch (e) {} }
      if (cookiesAvailable) { cookieRemove(key); return; }
      delete mem[key];
    },
  };
})();

const QURAN_META_URL = "https://raw.githubusercontent.com/MohamadHajjRabee/quran-qcf4/main/index.json";
const CACHE_AUDIO = "qam-audio-v1"; // للاستماع بلا اتصال (ميزة صريحة يطلبها المستخدم فقط)

let _indexPromise = null;
function getQuranIndex() {
  if (_indexPromise) return _indexPromise;
  _indexPromise = (async () => {
    const cached = safeStorage.getItem("qam_index_cache");
    if (cached) {
      try { return JSON.parse(cached); } catch (e) {}
    }
    const res = await fetch(QURAN_META_URL);
    if (!res.ok) throw new Error("HTTP " + res.status + " — " + QURAN_META_URL);
    const data = await res.json();
    try { safeStorage.setItem("qam_index_cache", JSON.stringify(data)); } catch (e) {}
    return data;
  })();
  return _indexPromise;
}

let _totalAyahsCache = new Map(); // surahId -> عدد الآيات
async function getTotalAyahs(surahId) {
  if (_totalAyahsCache.has(surahId)) return _totalAyahsCache.get(surahId);
  try {
    const idx = await getQuranIndex();
    const chapter = idx.chapters.find(c => c.id === surahId);
    const total = chapter ? chapter.verses_count : 286;
    _totalAyahsCache.set(surahId, total);
    return total;
  } catch (e) {
    return 286;
  }
}
async function getSurahName(surahId) {
  try {
    const idx = await getQuranIndex();
    const ch = idx.chapters.find(c => c.id === surahId);
    return ch ? ch.name_arabic : ("سورة " + toArabicDigits(surahId));
  } catch (e) {
    return "سورة " + toArabicDigits(surahId);
  }
}

    const nextBtn = document.querySelector(`.tab-btn[data-tab="${nextTab}"]`);

  }, { passive: true });
})();

async function runWithConcurrency(items, limit, worker) {
  let idx = 0;
  const total = items.length;
  async function runner() {
    while (idx < total) {
      const i = idx++;
      try { await worker(items[i], i); } catch (e) {}
    }
  }
  const runners = [];
  const n = Math.min(limit, total) || 1;
  for (let i = 0; i < n; i++) runners.push(runner());
  await Promise.all(runners);
}

/* التشغيل الفعلي: يبدأ فورًا وبشكل متزامن مع الضغط (شرط أساسي كي لا
   تحجب المتصفحات التشغيل التلقائي)، وأي بيانات إضافية تُجلب بالخلفية. */
function playAyah(surahId, ayahNum) {
  const reciter = RECITERS.find(r => r.id === Settings.reciterId) || RECITERS[0];
  const verseKey = `${surahId}:${ayahNum}`;
  const url = everyayahUrl(reciter.folder, surahId, ayahNum);

  activeSurah = surahId;
  activeAyah = ayahNum;
  audioEl.dataset.surah = String(surahId);
  audioEl.dataset.ayah = String(ayahNum);
  audioEl.dataset.reciter = Settings.reciterId;
  updateNowPlayingUI(surahId, ayahNum);

  if (activeTotalAyahs === null || audioEl.dataset._totalSurah !== String(surahId)) {
    audioEl.dataset._totalSurah = String(surahId);
    getTotalAyahs(surahId).then(total => { if (activeSurah === surahId) activeTotalAyahs = total; });
  }

  if (navigator.onLine === false) {
    playFromCacheOrNotify(url, verseKey);
    return;
  }

  audioEl.src = url;
  audioEl.play();
  setPlayingUI(true);

  const stallTimer = setTimeout(() => {
    if (audioEl.dataset.ayah === String(ayahNum) && audioEl.readyState < 2) playFromCacheOrNotify(url, verseKey, true);
  }, 4000);

  const onError = async () => {
    audioEl.removeEventListener("error", onError);
    clearTimeout(stallTimer);
    await playFromCacheOrNotify(url, verseKey, true);
  };
  audioEl.addEventListener("error", onError, { once: true });
  audioEl.addEventListener("canplay", () => clearTimeout(stallTimer), { once: true });
}

async function playFromCacheOrNotify(url, verseKey, tryNetworkFetchToo) {
  try {
    const cache = await caches.open(CACHE_AUDIO);
    const hit = await cache.match(url);
    if (hit) {
      audioEl.src = URL.createObjectURL(await hit.blob());
      audioEl.play();
      setPlayingUI(true);
      return;
    }
  } catch (e) {}
  if (tryNetworkFetchToo) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        audioEl.src = URL.createObjectURL(await res.blob());
        audioEl.play();
        setPlayingUI(true);
        return;
      }
    } catch (e2) {}
  }
  setPlayingUI(false);
  showOfflineNotice();
}

let _offlineNoticeShown = false;
function showOfflineNotice() {
  if (_offlineNoticeShown) return;
  _offlineNoticeShown = true;
  setTimeout(() => { _offlineNoticeShown = false; }, 5000);
  const bar = document.createElement("div");
  bar.textContent = "هذه الآية غير محمَّلة، ولا يوجد اتصال بالإنترنت الآن";
  bar.style.cssText = "position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:12px; font-size:12.5px; z-index:60; box-shadow:var(--shadow);";
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 3000);
}

function startPlayback(surahId, seekVerseKey) {
  const ayahNum = seekVerseKey ? parseInt(seekVerseKey.split(":")[1], 10) : 1;
  playAyah(surahId, ayahNum);
}

playBtn.addEventListener("click", () => {
  if (activeSurah && !audioEl.paused && !audioEl.ended) { audioEl.pause(); setPlayingUI(false); return; }
  if (activeSurah && audioEl.paused && audioEl.currentTime > 0) { audioEl.play(); setPlayingUI(true); return; }
  startPlayback(activeSurah || 1, activeAyah ? `${activeSurah}:${activeAyah}` : null);
});

repeatBtn.addEventListener("click", () => { repeatMode = !repeatMode; repeatBtn.classList.toggle("active", repeatMode); });

async function skipAyah(delta) {
  if (!activeSurah || !activeAyah) return;
  const total = await getTotalAyahs(activeSurah);
  const nextAyah = activeAyah + delta;
  if (nextAyah < 1) {
    if (activeSurah > 1) { const prevTotal = await getTotalAyahs(activeSurah - 1); playAyah(activeSurah - 1, prevTotal); }
    return;
  }
  if (nextAyah > total) {
    if (activeSurah < 114) playAyah(activeSurah + 1, 1);
    return;
  }
  playAyah(activeSurah, nextAyah);
}
prevAyahBtn.addEventListener("click", () => skipAyah(-1));
nextAyahBtn.addEventListener("click", () => skipAyah(1));

audioEl.addEventListener("ended", async () => {
  if (!activeSurah || !activeAyah) { setPlayingUI(false); return; }
  if (repeatMode) { audioEl.currentTime = 0; audioEl.play(); return; }
  const total = await getTotalAyahs(activeSurah);
  const nextAyah = activeAyah + 1;
  if (nextAyah > total) {
    if (activeSurah < 114) playAyah(activeSurah + 1, 1);
    else setPlayingUI(false);
    return;
  }
  playAyah(activeSurah, nextAyah);
});

/* ---------- تهيئة شاشة الاستماع عند اختيار سورة ---------- */
async function initPlayer(surah, ayah) {
  document.getElementById("playerReciterName").textContent = currentReciterName();
  document.getElementById("playerSurahName").textContent = "سورة " + toArabicDigits(surah);
  document.getElementById("playerAyahLbl").textContent = "—";
  try {
    const idx = await getQuranIndex();
    const ch = idx.chapters.find(c => c.id === surah);
    if (ch) {
      document.getElementById("playerSurahName").textContent = "سورة " + ch.name_arabic;
      document.getElementById("playerSurahMeta").textContent = (REVELATION_AR[ch.revelation_place] || "") + " — " + toArabicDigits(ch.verses_count) + " آية";
    }
  } catch (e) {}
  startPlayback(surah, ayah ? `${surah}:${ayah}` : null);
}

/* ---------------------------------------------------------
   الإقلاع
   --------------------------------------------------------- */
function renderBookmarkCard() {
  const wrap = document.getElementById("bookmarkWrap");
  const lbl = document.getElementById("bookmarkSurahLbl");
  const surah = Settings.lastSurah;
  if (!surah) { wrap.style.display = "none"; return; }
  const name = Settings.lastSurahName;
  lbl.textContent = (name ? "سورة " + name : "سورة " + toArabicDigits(surah)) + " — آية " + toArabicDigits(Settings.lastAyah);
  wrap.style.display = "block";
}
document.getElementById("bookmarkCard").addEventListener("click", () => {
  const surah = Settings.lastSurah;
  if (!surah) return;
  showPlayer(surah, Settings.lastAyah);
});
renderBookmarkCard();

renderSurahList();
renderJuzList();
parseHashAndRoute();
</script>
